# TermMap v2 configuration (Phase A fixes; Phase C upgrades). v1 stays in configs/default.yaml.
# channel_weights: tuned on out-of-fold recall@80 (audit A9, artifacts_v2/cv/a9_rrf_weights.json)
seed: 42
num_threads: 8
paths:
  train: data/hackathon_train.csv
  icd_dict: data/icd10cm_codes.xlsx
  snomed_dict: data/SNOMEDCT_US_codes_and_descriptions.xlsx
  artifacts: artifacts_v2
  reports: reports/v2
cv:
  n_folds: 3
retrieval:
  channels:
  - bm25
  - char
  - dense
  - memory
  rrf_k: 60
  top_k: 80
  sibling_expand_top: 20
  dense_model: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  dense_fp16: true
  long_term_words: 32
  channel_weights:
    ICD10CM:
      bm25: 0.0
      char: 1.0
      dense: 1.5
      memory: 1.5
    SNOMEDCT_US:
      bm25: 0.75
      char: 1.0
      dense: 2.0
      memory: 1.5
  dense_max_len: 64
rerank:
  cross_encoder: ncbi/MedCPT-Cross-Encoder
  n_negatives: 15
  lr: 2.0e-05
  batch_size: 16
  max_len: 128
  epochs: 5
  ce_top:
    ICD10CM: 30
    SNOMEDCT_US: 40
  val_frac: 0.1
  context_chars: 100
  context_dropout: 0.5
  loss: listwise
  patience: 1
  final_epochs: median
  negatives: ltr
  negatives_ltr_oof_dir: artifacts/cv
  ce_siblings: true
predict:
  device: cuda
hierarchy:
  category_margin: 0.05
coupling:
  lambdas:
  - 0.0
  - 0.5
  - 1.0
  - 2.0
  - 4.0
  - 8.0
  top_n: 5
confidence:
  target_precision: 0.98
ltr:
  eval_at:
  - 10
dictionaries:
  icd_title: official
  snomed_tag: official
features:
  qualifier_version: 2
normalize:
  abbr_min_support: 2
  undotted_codes: true
